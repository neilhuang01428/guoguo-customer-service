name: build-guide

# 自動化守門（T4／T9）：改了 articles.json、文章內文（articles/）或產生器（scripts/）後 push，
# 這支會用 build-all.sh 一步到位重生：導外版 index.html、標籤頁 tag/、sitemap.xml，
# 並用 Pagefind 重建全文搜尋索引 pagefind/（對 dist 建、避開內部文件），最後提交回 main。
# 讓「新增文章記得重跑 build-homepage/build-tags/pagefind + commit」這些手動步驟不再會漏。
# build-all.sh 內含 build-neutral 的洩漏檢查守門；產出的 commit 帶 [skip ci]，不會再觸發自己。

on:
  # 手動補跑：後台的「首圖更新／導購設定」若和自動重生撞在同一分鐘，
  # 自動重生那次的 git push 會被遠端擋掉（non-fast-forward）而整個 job 失敗，
  # 且之後的 commit 多半不命中下方 paths、不會再觸發，index.html 就會停在舊版。
  # 遇到這種情況（首頁卡片還是 emoji 而不是首圖），到 Actions 頁按 Run workflow 補跑一次即可。
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'scripts/build-homepage.py'
      - 'scripts/build-tags.py'
      - 'scripts/build-sitemap.py'
      - 'scripts/build-llms.py'
      - 'scripts/build-neutral.sh'
      - 'scripts/build-all.sh'
      - 'articles/**'        # 文章內文有改 → 全文搜尋索引也要跟著更新

permissions:
  contents: write

concurrency:
  group: build-guide
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pagefind（build-neutral.sh 內 npx -y pagefind@1）需要 node
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 一鍵重生（首頁＋標籤頁＋sitemap＋dist＋Pagefind 索引，含洩漏檢查守門）
        run: bash scripts/build-all.sh

      # 為什麼要重試：這一步是把重生結果 commit 回 main，但 job 從開跑到這裡要 15～30 秒，
      # 期間如果有人（連續上架多篇、後台首圖／導購）又推了新 commit，這次 push 就會被
      # 遠端以 non-fast-forward 擋掉、整個 job 失敗。更麻煩的是後續 commit 多半不命中
      # 上方 paths、不會再觸發這支，index.html 就會停在舊版而且不會自動恢復
      # （2026-08-09 一次連續上架 8 篇，8 次觸發中有 3 次就是這樣掛掉的）。
      #
      # 重試刻意用「抓最新 → 重跑 build → 再 push」而不是 git pull --rebase：
      # 產物必須對應「當下最新的來源」才有意義。若只把舊產物 rebase 上去，
      # 期間新增的文章就會從首頁與搜尋索引裡消失；pagefind 是二進位索引檔，
      # 衝突時也無法合理合併。重跑一輪只要十幾秒，換得結果一定正確。
      - name: 若有變更就提交回 main（撞到別人 push 就重算重試）
        run: |
          git config user.name  "guoguo-guide-bot"
          git config user.email "guoguo-guide-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            # dist/ 與 index.neutral.html 皆 gitignored，不會被 add；只提交導外版要的產物。
            git add -A index.html sitemap.xml llms.txt tag pagefind
            if git diff --cached --quiet; then
              echo "index.html / sitemap.xml / llms.txt / tag / pagefind 已是最新，無需提交。"
              exit 0
            fi
            git commit -m "chore: 自動重生 index.html + sitemap.xml + llms.txt + tag/ + pagefind/ [skip ci]"
            if git push; then
              echo "已提交回 main（第 ${attempt} 次嘗試）"
              exit 0
            fi
            echo "::warning::push 被遠端擋下（期間有新的 commit）。抓最新來源重算後重試（第 ${attempt} 次）"
            git fetch origin main
            git reset --hard origin/main   # 丟掉剛才那個 commit，改站在最新的來源上
            bash scripts/build-all.sh      # 用最新來源重生一次，產物才對得上
          done
          echo "::error::重試 3 次仍無法提交回 main。請到 Actions 頁按 Run workflow 手動補跑一次。"
          exit 1
